<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{% block title %}Attendance ERP{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/erp.css') }}">
  {% block head %}{% endblock %}
</head>
<body class="erp-body {% block body_class %}{% endblock %}">
<div class="{% block shell_class %}erp-shell{% endblock %}">
  {% block nav %}{% include 'partials/erp_nav.html' %}{% endblock %}
  {% block content %}{% endblock %}
</div>
{% block modals %}{% endblock %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/erp.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
