<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Student Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="right-panel">
    <div class="card p-4 shadow-sm">
        <div class="d-flex justify-content-between align-items-center mb-3">
             <h4 class="mb-0">Welcome, {{ session.get('username') }}!</h4>
             <a href="/logout" class="btn btn-danger btn-sm">Logout</a>
        </div>

        <div class="alert alert-success small">
            <strong>Access Level:</strong> Your personal attendance dashboard.
        </div>
        
        <hr>

        <!-- NEW: Personal Activity Log -->
        <h5 class="mb-3">My Recent Activity</h5>
        <ul id="personalNotificationList" class="list-group list-group-flush mb-3" style="max-height: 250px; overflow-y: auto;">
            <li class="list-group-item text-muted small">Loading your records...</li>
        </ul>
        
        <hr>
        
        <h5 class="mb-3">Sign Out (Mark Exit)</h5>
        <div class="text-center">
            <video id="signOutVideo" width="320" height="240" autoplay muted style="border-radius:8px; border:2px solid #ccc; display: none;"></video>
            <div id="signOutStatus" class="alert alert-secondary mt-2 small">Click the button to use your face to sign out.</div>
        </div>
        <button id="signOutBtn" class="btn btn-warning w-100 mt-2">Sign Out by Face</button>

    </div>
</div>
<script src="{{ url_for('static', filename='js/student_dashboard.js') }}"></script>
<script src="{{ url_for('static', filename='js/camera_signout.js') }}"></script>
</body>
</html>
