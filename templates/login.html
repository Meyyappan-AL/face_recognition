<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Facial Recognition Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        /* Add specific styles for login page if they differ from main style.css */
        body {
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="right-panel">
        <div class="text-center mb-4">
            <img src="{{ url_for('static', filename='images/vcet.jpg') }}" alt="Logo" style="height: 50px; border-radius: 8px;">
            <h3 class="mt-3">System Login</h3>
            <p class="text-muted">Digital Facial Recognition Attendance</p>
        </div>

        <div id="alert" class="alert d-none"></div>

        <form id="loginForm">
            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="username" placeholder="Username" required autocomplete="username">
                <label for="username">Username</label>
            </div>

            <div class="form-floating mb-3">
                <input type="password" class="form-control" id="password" placeholder="Password" required autocomplete="current-password">
                <label for="password">Password</label>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2" id="loginBtn">Login</button>
        </form>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const alertDiv = document.getElementById('alert');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) {
                showAlert('Please enter both username and password.', 'danger');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerHTML = `<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Logging in...`;

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    showAlert('Login successful! Redirecting...', 'success');
                    // Redirect based on the role provided by the server
                    setTimeout(() => {
                        if (data.role === 'admin') {
                            window.location.href = '/';
                        } else if (data.role === 'staff') {
                            window.location.href = '/staff_monitor';
                        } else if (data.role === 'student') {
                            window.location.href = '/student_dashboard';
                        } else {
                            window.location.href = '/'; // Default fallback
                        }
                    }, 1000);
                } else {
                    showAlert(data.message || 'Invalid credentials.', 'danger');
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Login';
                }
            } catch (error) {
                showAlert('Connection error. Please try again.', 'danger');
                loginBtn.disabled = false;
                loginBtn.textContent = 'Login';
            }
        });

        function showAlert(message, type) {
            alertDiv.className = `alert alert-${type}`;
            alertDiv.textContent = message;
            alertDiv.classList.remove('d-none');
        }
    </script>
</body>
</html>
